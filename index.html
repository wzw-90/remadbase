                                  <img class="boss-avatar-sm" src="${b.portraitImage || b.previewImage || ''}" onerror="if(this.src!=='${b.previewImage||''}')this.src='${b.previewImage||''}';" alt="${b.title}"/>
                                  <span class="avatar-clip"></span>
                                </div>
                                <div class="boss-info-sm">
                                  <div class="boss-title-sm" onclick="openBossDetails(${b.id})">${b.title}</div>
                                  <div class="boss-badges-sm">
                                    <span class="badge-hp">🩸 ${b.health >= 1000 ? (b.health / 1000) + 'k' : b.health} HP</span>
                                    <span class="badge-dmg">⚔️ ${b.damageMin}–${b.damageMax}</span>
                                    <span class="badge-dmg" style="color:var(--accent-pills);">${b.needs && b.needs.min_level ? b.needs.min_level : 1}–${b.maxLevelDrops || 50} ур.</span>
                                  </div>
                                </div>
                              </div>

                              <div class="boss-stats-strip">
                                <div><img src="images/ui/icon_xp.png?v=2" class="inline-icon" alt="XP"/> <span>Опыт:</span> <strong style="color:var(--accent-purple);">+${b.xp.toLocaleString()}</strong></div>
                                <div><span>⏱️ Время:</span> <strong>${b.durationMinutes} мин</strong></div>
                                <div><span>👥 Лимит:</span> <strong>${b.maxUserCount} чел</strong></div>
                              </div>

                              ${b.artifactTitle ? `
                                <div class="boss-quest-item">
                                  ${b.artifactImage ? `<img src="${b.artifactImage}" width="18" height="18" style="border-radius:2px;"/>` : ''}
                                  <span>📦 Квестовый предмет: <strong>${(() => {
                                    const artItem = (data.inventory || []).find(i => i.title.trim().toLowerCase() === b.artifactTitle.trim().toLowerCase());
                                    if (artItem) {
                                      return `<a href="javascript:void(0)" class="drop-link" onclick="openEventItemDetails(${artItem.id})" title="Посмотреть предмет: ${b.artifactTitle}">${b.artifactTitle}</a> (100%)`;
                                    }
                                    return `${b.artifactTitle} (100%)`;
                                  })()}</strong></span>
                                </div>
                              ` : ''}

                              ${(() => {
                                const artTitleLower = (b.artifactTitle || '').trim().toLowerCase();
                                const mainDrops = b.drops.filter(d => !d.title.includes('Мутаген') && (!artTitleLower || d.title.trim().toLowerCase() !== artTitleLower));
                                const mutagenDrops = b.drops.filter(d => d.title.includes('Мутаген'));
                                const isMutOpen = !!(state.openedMutagens && state.openedMutagens[b.id]);

                                return `
                                  <div class="boss-drops-wrap">
                                    ${mainDrops.map(d => {
                                      let innerHtml = `<span>${d.title}</span>`;
                                      if (d.type === 'inventory') {
                                        innerHtml = `<span onclick="openEventItemDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть предмет: ${d.title}">${d.title}</span>`;
                                      } else if (d.type === 'access_weapon') {
                                        innerHtml = `<span onclick="openWeaponDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть оружие: ${d.title}">${d.title}</span>`;
                                      } else if (d.type === 'access_cloth') {
                                        innerHtml = `<span onclick="openClothDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть одежду/питомца: ${d.title}">${d.title}</span>`;
                                      } else if (d.type === 'access_ornament') {
                                        const cleanT = d.title.replace(/^Доступ:\s*/, '').replace(/^Тату\s*/, '');
                                        innerHtml = `<span onclick="openTattooDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть татуировку: ${cleanT}">${cleanT}</span>`;
                                      }
                                      return `
                                        <span class="drop-tag ${d.type && d.type.startsWith('access_') ? 'is-access' : ''}" title="${d.hint || d.title}">
                                          ${innerHtml}
                                          <span class="drop-prob ${d.probability === 100 ? 'guaranteed' : ''}">${d.probability}%</span>
                                        </span>
                                      `;
                                    }).join('')}

                                    ${mutagenDrops.length > 0 ? `
                                      <button class="boss-mutagens-toggle-btn ${isMutOpen ? 'open' : ''}" id="mut_btn_${b.id}" data-count="${mutagenDrops.length}" onclick="toggleBossMutagens(${b.id}, this)">
                                        🧪 Мутагены (${mutagenDrops.length}) ${isMutOpen ? '▲' : '▼'}
                                      </button>
                                    ` : ''}
                                  </div>

                                  ${mutagenDrops.length > 0 ? `
                                    <div class="boss-mutagens-wrap ${isMutOpen ? 'open' : ''}" id="mut_wrap_${b.id}">
                                      ${mutagenDrops.map(d => `
                                        <span class="drop-tag drop-tag-mutagen" title="${d.hint || d.title}">
                                          <span>${d.title}</span>
                                          <span class="drop-prob ${d.probability === 100 ? 'guaranteed' : ''}">${d.probability}%</span>

                                `;

                      </div>

                    <!-- 2. Businesses of this Corps -->
                    ${bizList.length > 0 ? `
                      <div class="ward-sub-section">
                        <div class="ward-sub-title">
                          <span>🏢 ОБЪЕКТЫ БОЛЬНИЦЫ (${bizList.length})</span>

                        <div class="corps-grid-2col">

                            const topUp = bz.upgrades[bz.upgrades.length - 1] || {};
                            const topReward = topUp.drops && topUp.drops.currency1 ? topUp.drops.currency1.value : (topUp.drops && topUp.drops.currency3 ? topUp.drops.currency3.value : 0);

                            return `
                              <div class="biz-card-compact">
                                <div class="biz-card-head">
                                  <div class="biz-title-sm">🏥 ${bz.title}</div>
                                  <span class="corps-badge-bosses">${bz.upgrades.length} ур.</span>
                                </div>

                                <div class="biz-summary-line">
                                  Макс. ур: ${bz.upgrades.length} &bull; Доход: +${topReward} &bull; Нужно: ${totalStr}
                                </div>

                                <button class="biz-toggle-table-btn" id="biz_btn_${bz.id}" onclick="toggleBizTable(${bz.id}, this)">
                                  ${isOpen ? 'Свернуть таблицу ▲' : 'Таблица уровней 1..6 ▼'}
                                </button>

                                <table class="biz-table-compact ${isOpen ? 'open' : ''}" id="biz_table_${bz.id}">
                                  <thead>
                                    <tr>
                                      <th>Ур.</th>
                                      <th>Требуется</th>
                                      <th><img src="images/ui/icon_coin.png?v=2" class="inline-icon" alt="Монеты"/> Золото</th>
                                      <th><img src="images/ui/icon_pill.png?v=2" class="inline-icon" alt="Пилюли"/> Пилюли</th>
                                      <th><img src="images/ui/icon_real.png?v=2" class="inline-icon" alt="Купюры"/> Купюры</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    ${bz.upgrades.map(up => {
                                      const reqItems = (up.price.items || []).map(it => {
                                        const name = invMap[it.id] || it.id;
                                        return `<a href="javascript:void(0)" class="biz-item-link" onclick="openEventItemDetails(${it.id})" title="Посмотреть информацию: ${name}">${name}</a> x${it.count}`;
                                      }).join(', ') || 'Бесплатно';
                                      const c1 = up.drops && up.drops.currency1 ? up.drops.currency1.value : '—';
                                      const c2 = up.drops && up.drops.currency2 ? up.drops.currency2.value : '—';

                                          <td style="color:var(--accent-pills);font-weight:600;">${c3}</td>
                                          <td style="color:var(--accent-green);font-weight:600;">${c2}</td>

                                    }).join('')}
                                  </tbody>
                                </table>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    ` : ''}

                    <!-- 3. Jobs of this Corps -->
                    ${jobsList.length > 0 ? (() => {
                      const jobZoneName = (jobsList[0] && jobsList[0].jobZoneTitle) ? jobsList[0].jobZoneTitle.trim() : 'Работа';
                      const cMap = data.collectionsMap || {};

                      /* Determine collection name from first job's drops */
                      const rawFirstObjects = ((jobsList[0].drops || {}).objects || []);
                      const firstInfo2 = rawFirstObjects.length ? cMap[rawFirstObjects[0].id] : null;
                      const collName = firstInfo2 ? firstInfo2.collection_name : null;

                      /* Patch: fill in missing collection elements from collectionsMap */
                      const patchObjects = (objects) => {
                        if (!objects.length || !collName) return objects;
                        const objIds = new Set(objects.map(o => o.id));
                        const allCollEls = [];
                        for (const [k, v] of Object.entries(cMap)) {
                          if (v.collection_name === collName) {
                            allCollEls.push({ id: Number(k), index: v.element_index });
                          }
                        }
                        if (allCollEls.length <= objects.length) return objects;
                        /* Default probability = most common non-100 prob among existing */
                        const probs = objects.map(o => o.probability).filter(p => p !== 100);
                        const defaultProb = probs.length ? probs.sort((a,b) => probs.filter(v=>v===b).length - probs.filter(v=>v===a).length)[0] : 0.01;
                        const patched = [...objects];
                        for (const el of allCollEls) {
                          if (!objIds.has(el.id)) {
                            patched.push({ id: el.id, probability: defaultProb });
                          }
                        }
                        patched.sort((a, b) => {
                          const ai = cMap[a.id] ? cMap[a.id].element_index : 999;
                          const bi = cMap[b.id] ? cMap[b.id].element_index : 999;
                          return ai - bi;
                        });
                        return patched;
                      };
                      const firstObjects = patchObjects(rawFirstObjects);

                      /* Check if ALL jobs share identical drops (ids + probabilities) */
                      const sig = j => JSON.stringify(patchObjects((j.drops || {}).objects || []).map(o => [o.id, o.probability]));
                      const firstSig = sig(jobsList[0]);
                      const allSameDrops = jobsList.every(j => sig(j) === firstSig);

                      /* Build the shared stash banner — always show if there's a collection */
                      const bannerElements = firstObjects.map(o => {
                        const info = cMap[o.id];
                        const label = collName
                          ? `Эл. #${info ? info.element_index : o.id}`
                          : (invMap[o.id] || ('#' + o.id));
                        const isGuaranteed = o.probability === 100;
                        return `<span class="drop-tag"><span>${label}</span><span class="drop-prob ${isGuaranteed ? 'guaranteed' : ''}">${o.probability}%</span></span>`;
                      }).join('');

                      /* For rows with different drops, build a compact diff note */
                      const renderRowNote = (j) => {
                        if (allSameDrops) return '';
                        const jSig = sig(j);
                        if (jSig === firstSig) return '';
                        const objects = patchObjects((j.drops || {}).objects || []);
                        const diffs = objects.filter((o, i) => {
                          return !firstObjects[i] || o.id !== firstObjects[i].id || o.probability !== firstObjects[i].probability;
                        });
                        if (!diffs.length) return '';
                        const diffHtml = diffs.map(o => {
                          const info = cMap[o.id];
                          const label = collName
                            ? `Эл. #${info ? info.element_index : o.id}`
                            : (invMap[o.id] || ('#' + o.id));
                          const isGuaranteed = o.probability === 100;
                          return `<span class="drop-tag" style="border-color:rgba(245,158,11,0.4);"><span>${label}</span><span class="drop-prob ${isGuaranteed ? 'guaranteed' : ''}">${o.probability}%</span></span>`;
                        }).join('');
                        return `<div style="display:flex;flex-wrap:wrap;gap:0.25rem;align-items:center;margin-top:0.2rem;"><span style="color:var(--accent-gold);font-size:0.68rem;font-family:var(--font-mono);">⚠️</span>${diffHtml}</div>`;
                      };

                      return `
                        <div class="ward-sub-section">
                          <div class="ward-sub-title">
                            <span>💼 РАБОТА: ${jobZoneName.toUpperCase()} (${jobsList.length})</span>
                          </div>
                          ${firstObjects.length > 0 ? `
                            <div class="jobs-shared-stash">
                              <span class="jobs-stash-title">📦 ${collName ? `Заначка «${collName}»:` : 'Дроп:'}</span>
                              ${bannerElements}
                              ${!allSameDrops ? '<span style="color:var(--text-muted);font-size:0.68rem;font-style:italic;margin-left:0.3rem;">шансы могут отличаться ⚠️</span>' : ''}
                            </div>
                          ` : ''}
                          <div class="jobs-table-wrap">
                            <table class="jobs-table">
                              <thead>
                                <tr>
                                  <th>Работа</th>
                                  <th><img src="images/ui/icon_energy.png?v=2" class="inline-icon" alt="Энергия"/> Энергия</th>
                                  <th><img src="images/ui/icon_coin.png?v=2" class="inline-icon" alt="Монеты"/> Монеты</th>
                                  <th><img src="images/ui/icon_xp.png?v=2" class="inline-icon" alt="XP"/> Опыт</th>
                                </tr>
                              </thead>
                              <tbody>
                                ${jobsList.map(j => {
                                  const p = j.price || {};
                                  const d = j.drops || {};
                                  const energy = p.work_energy || p.workEnergy || 0;
                                  const coins = d.currency1 ? d.currency1.value : 0;
                                  const xp = d.xp ? d.xp.value : 0;
                                  const note = renderRowNote(j);
                                  return `
                                    <tr>
                                      <td class="job-name-cell">${j.title}${note}</td>
                                      <td style="color:#ff6b6b;font-weight:700;">${energy}</td>
                                      <td style="color:var(--accent-gold);font-weight:700;">+${coins}</td>
                                      <td style="color:var(--accent-purple);font-weight:700;">+${xp} XP</td>
                                    </tr>
                                  `;
                                }).join('')}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      `;
                    })() : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      UI.content.innerHTML = html;
    }

    /* Fast Universal Search Handler */
    function renderSearch(data, q) {
      let html = `<div style="margin-bottom:0.6rem;color:var(--text-muted);font-size:0.82rem;">Результаты поиска «<strong>${q}</strong>»:</div>`;
      
      const matchedBosses = data.bosses.filter(b => 
        b.title.toLowerCase().includes(q) ||
        b.id.toString() === q ||
        b.drops.some(d => (d.title && d.title.toLowerCase().includes(q)) || (d.originalTitle && d.originalTitle.toLowerCase().includes(q))) ||
        (b.artifactTitle && b.artifactTitle.toLowerCase().includes(q))
      );
      const matchedWeapons = (data.weapons || []).filter(w => 
        (w.title && w.title.toLowerCase().includes(q)) ||
        w.id.toString() === q
      );
      const matchedClothes = (data.clothes || []).filter(c => 
        c.category !== 'Оружие' && c.category !== 'Животное' && (
          (c.title && c.title.toLowerCase().includes(q)) ||
          (c.category && c.category.toLowerCase().includes(q)) ||
          c.id.toString() === q
        )
      );
      const matchedPets = (data.clothes || []).filter(p => 
        p.category === 'Животное' && (
          (p.title && p.title.toLowerCase().includes(q)) ||
          p.id.toString() === q
        )
      );
      const matchedTattoos = (data.tattoos || []).filter(t => 
        (t.title && t.title.toLowerCase().includes(q)) ||
        (t.slotTitle && t.slotTitle.toLowerCase().includes(q)) ||
        t.id.toString() === q
      );
      const matchedMutagens = ((data.mutagens && data.mutagens.enchants) || []).filter(e => 
        (e.title && e.title.toLowerCase().includes(q)) ||
        e.id.toString() === q
      );
      const matchedBiz = data.businesses.filter(b => b.title.toLowerCase().includes(q));
      const matchedLocs = data.locations.filter(l => l.title.toLowerCase().includes(q) || (l.name && l.name.toLowerCase().includes(q)));
      const matchedItems = (data.inventory || []).filter(i => 
        (i.title && i.title.toLowerCase().includes(q)) ||
        i.id.toString() === q
      );

      if (matchedBosses.length === 0 && matchedBiz.length === 0 && matchedLocs.length === 0 && matchedWeapons.length === 0 && matchedClothes.length === 0 && matchedPets.length === 0 && matchedTattoos.length === 0 && matchedMutagens.length === 0 && matchedItems.length === 0) {
        UI.content.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--text-dim);">Ничего не найдено по запросу «${q}».</div>`;

        matchedLocs.forEach(l => {
          const z = data.zones.find(zone => zone.id === l.zoneId);
          html += `
            <button class="block-pill-btn" onclick="state.search=''; UI.search.value=''; selectBlock('${z.code}'); selectLocation(${l.id});">
              <span class="block-pill-code">${l.title}</span>
              <span>${l.name || z.title} &rarr;</span>

          `;
        });
        html += `</div>`;
      }

      if (matchedBosses.length > 0) {
        html += `<div style="font-size:0.8rem;font-weight:700;color:#f87171;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem;"><span>🗂️ Буйные больницы (${matchedBosses.length})</span></div>`;
        html += `<div class="corps-grid-2col" style="margin-bottom:1.2rem;">`;
        matchedBosses.forEach(b => {

          const artTitleLower = (b.artifactTitle || '').trim().toLowerCase();
          const mainDrops = (b.drops || []).filter(d => !d.title.includes('Мутаген') && (!artTitleLower || d.title.trim().toLowerCase() !== artTitleLower));
          const mutagenDrops = (b.drops || []).filter(d => d.title.includes('Мутаген'));
          const isMutOpen = !!(state.openedMutagens && state.openedMutagens['s_' + b.id]);

              <div class="boss-stats-strip">

                <div><span>⏱️ Время:</span> <strong>${b.durationMinutes} мин</strong></div>
                <div><span>👥 Лимит:</span> <strong>${b.maxUserCount} чел</strong></div>
              </div>

              ${b.artifactTitle ? `
                <div class="boss-quest-item">
                  ${b.artifactImage ? `<img src="${b.artifactImage}" width="18" height="18" style="border-radius:2px;flex-shrink:0;" alt="Квест"/>` : ''}
                  <span>📦 Квестовый предмет: <strong>${b.artifactTitle} (100%)</strong></span>

              ` : ''}

              ${(mainDrops.length > 0 || mutagenDrops.length > 0) ? `
                <div class="boss-drops-wrap">
                  ${mainDrops.map(d => {
                    let innerHtml = `<span>${d.title}</span>`;
                    if (d.type === 'inventory') {
                      innerHtml = `<span onclick="openEventItemDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть предмет: ${d.title}">${d.title}</span>`;
                    } else if (d.type === 'access_weapon') {
                      innerHtml = `<span onclick="openWeaponDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть оружие: ${d.title}">${d.title}</span>`;
                    } else if (d.type === 'access_cloth') {
                      innerHtml = `<span onclick="openClothDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть одежду/питомца: ${d.title}">${d.title}</span>`;
                    } else if (d.type === 'access_ornament') {
                      const cleanT = d.title.replace(/^Доступ:\s*/, '').replace(/^Тату\s*/, '');
                      innerHtml = `<span onclick="openTattooDetails(${d.id})" style="cursor:pointer;text-decoration:underline;" title="Посмотреть татуировку: ${cleanT}">${cleanT}</span>`;
                    }
                    return `
                      <span class="drop-tag ${d.type && d.type.startsWith('access_') ? 'is-access' : ''}" title="${d.hint || d.title}">
                        ${innerHtml}
                        <span class="drop-prob ${d.probability === 100 ? 'guaranteed' : ''}">${d.probability}%</span>
                      </span>
                    `;
                  }).join('')}

                  ${mutagenDrops.length > 0 ? `
                    <button class="boss-mutagens-toggle-btn ${isMutOpen ? 'open' : ''}" id="mut_btn_s_${b.id}" data-count="${mutagenDrops.length}" onclick="toggleBossMutagens('s_' + ${b.id}, this)">
                      🧪 Мутагены (${mutagenDrops.length}) ${isMutOpen ? '▲' : '▼'}
                    </button>
                  ` : ''}
                </div>

                ${mutagenDrops.length > 0 ? `
                  <div class="boss-mutagens-wrap ${isMutOpen ? 'open' : ''}" id="mut_wrap_s_${b.id}">
                    ${mutagenDrops.map(d => `
                      <span class="drop-tag drop-tag-mutagen" title="${d.hint || d.title}">
                        <span>${d.title}</span>
                        <span class="drop-prob ${d.probability === 100 ? 'guaranteed' : ''}">${d.probability}%</span>
                      </span>
                    `).join('')}
                  </div>
                ` : ''}
              ` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      if (matchedWeapons.length > 0) {
        html += `<div style="font-size:0.8rem;font-weight:700;color:var(--accent-gold);margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem;"><span>🔪 Оружие арсенала (${matchedWeapons.length})</span></div>`;
        html += `<div class="grid" style="margin-bottom:1.2rem;">`;
        matchedWeapons.forEach(w => {
          const p = w.price || {};
          const priceStr = [

            p.currency2 ? `${p.currency2} куп.` : '',

          ].filter(Boolean).join(', ') || 'Бесплатно';

          const bosses = (w.sources && w.sources.bosses) || [];

          html += `
            <div class="card" style="cursor:pointer;" onclick="openWeaponDetails(${w.id})" title="Подробнее об оружии, улучшении и источниках">
              <div style="display:flex;gap:0.65rem;align-items:center;">
                <img src="${w.image || ''}" width="42" height="42" style="background:#000;border-radius:4px;border:1px solid var(--border);object-fit:contain;flex-shrink:0;" alt="${w.title}"/>
                <div style="min-width:0;flex:1;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:0.3rem;">
                    <span style="font-weight:700;color:#fff;font-size:0.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${w.title}">${w.title}</span>

                  </div>

                <span style="color:var(--accent-gold);font-weight:600;">${priceStr}</span>
              </div>
            </div>

        });
        html += `</div>`;

          html += `
            <div class="biz-card-compact">

      if (matchedMutagens.length > 0) {

        html += `<div class="grid" style="margin-bottom:1.2rem;">`;

          const buff = (e.buffs && e.buffs[0] && e.buffs[0].stats && e.buffs[0].stats[0]) || {};
          const statMap = { skill1: 'Ярость / Урон', skill2: 'Защита', skill3: 'Здоровье' };

    /* =========================================================================
       MARKET VIEW (Weapons, Clothes, Pets, Tattoos with Sidebar Filters)
       ========================================================================= */
    function renderMarket(data, q) {
      const allWeapons = data.weapons || [];
      const allClothes = (data.clothes || []).filter(c => c.category !== 'Оружие' && c.category !== 'Животное');
      const allPets = (data.clothes || []).filter(c => c.category === 'Животное');
      const allTattoos = data.tattoos || [];

      // Clean top ribbon with only the 4 main categories
      UI.controls.innerHTML = `
        <div class="weapon-filter-ribbon">
          <button class="weapon-filter-btn ${state.marketSection === 'weapons' ? 'active' : ''}" onclick="state.marketSection='weapons'; state.marketCurrency='all'; state.marketSidebarOpen=false; renderContent();">
            🔪 Оружие
          </button>
          <button class="weapon-filter-btn ${state.marketSection === 'clothes' ? 'active' : ''}" onclick="state.marketSection='clothes'; state.marketCurrency='all'; state.marketSidebarOpen=false; renderContent();">
            👕 Одежда
          </button>
          <button class="weapon-filter-btn ${state.marketSection === 'pets' ? 'active' : ''}" onclick="state.marketSection='pets'; state.marketCurrency='all'; state.marketSidebarOpen=false; renderContent();">
            🐾 Питомцы
          </button>
          <button class="weapon-filter-btn ${state.marketSection === 'tattoos' ? 'active' : ''}" onclick="state.marketSection='tattoos'; state.marketCurrency='all'; state.marketSidebarOpen=false; renderContent();">
            🐉 Татуировки
          </button>
        </div>
      `;

      function getCurrTitle(curr) {
        if (curr === 'currency1') return 'Монеты';
        if (curr === 'currency2') return 'Купюры';
        if (curr === 'currency3') return 'Таблетки';
        if (curr === 'boss') return 'Дроп с боссов';
        if (curr === 'free') return 'Бесплатное';
        return 'Все';
      }

      function matchCurr(item, curr) {
        if (curr === 'all') return true;
        const p = item.price || {};
        if (curr === 'currency1') return (p.currency1 > 0);
        if (curr === 'currency2') return (p.currency2 > 0);
        if (curr === 'currency3') return (p.currency3 > 0);
        if (curr === 'boss') return (item.sources && item.sources.bosses && item.sources.bosses.length > 0);
        if (curr === 'free') return (!p.currency1 && !p.currency2 && !p.currency3);
        return true;
      }

      function getItemPriceStr(item) {
        const p = item.price || {};
        const parts = [];
        if (p.currency1) parts.push(`${p.currency1.toLocaleString()} мон.`);
        if (p.currency2) parts.push(`${p.currency2.toLocaleString()} куп.`);
        if (p.currency3) parts.push(`${p.currency3.toLocaleString()} табл.`);
        if (parts.length > 0) return parts.join(', ');
        if (item.sources && item.sources.bosses && item.sources.bosses.length > 0) return 'Выбивается с боссов';
        return 'Бесплатно';
      }

      function renderCurrencySideGroup(showFree = false) {
        return `
          <div class="market-side-group">
            <div class="market-side-title">Валюта / Дроп</div>
            <button class="market-side-btn ${state.marketCurrency === 'all' ? 'active' : ''}" onclick="state.marketCurrency='all'; renderContent();">
              <span>Все валюты</span>
            </button>
            <button class="market-side-btn ${state.marketCurrency === 'currency1' ? 'active' : ''}" onclick="state.marketCurrency='currency1'; renderContent();">
              <span>🪙 Монеты</span>
            </button>
            <button class="market-side-btn ${state.marketCurrency === 'currency3' ? 'active' : ''}" onclick="state.marketCurrency='currency3'; renderContent();">
              <span>💊 Таблетки</span>
            </button>
            <button class="market-side-btn ${state.marketCurrency === 'currency2' ? 'active' : ''}" onclick="state.marketCurrency='currency2'; renderContent();">
              <span>💵 Купюры</span>
            </button>
            <button class="market-side-btn ${state.marketCurrency === 'boss' ? 'active' : ''}" onclick="state.marketCurrency='boss'; renderContent();">
              <span>🏥 Дроп с боссов</span>
            </button>
            ${showFree ? `
              <button class="market-side-btn ${state.marketCurrency === 'free' ? 'active' : ''}" onclick="state.marketCurrency='free'; renderContent();">
                <span>🎁 Бесплатное</span>
              </button>
            ` : ''}
          </div>
        `;
      }

      let sidebarHtml = '';
      let cardsHtml = '';
      let activeFilteredCount = 0;
      let activeFiltersSummary = '';

      if (state.marketSection === 'weapons') {
        let filtered = allWeapons.filter(w => {
          if (!matchCurr(w, state.marketCurrency)) return false;
          if (!q) return true;
          const titleMatch = w.title && w.title.toLowerCase().includes(q);
          return w.id.toString() === q || (w.damage && w.damage.toString() === q) || titleMatch;
        });
        filtered.sort((a, b) => b.damage - a.damage);

        activeFilteredCount = filtered.length;
        const currT = getCurrTitle(state.marketCurrency);
        activeFiltersSummary = currT === 'Все' ? 'Все валюты' : currT;

        sidebarHtml = renderCurrencySideGroup(true);

        if (filtered.length === 0) {
          cardsHtml = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-dim);">Оружие не найдено по выбранным фильтрам</div>`;
        } else {
          filtered.forEach(w => {
            const priceStr = getItemPriceStr(w);
            const bosses = (w.sources && w.sources.bosses) || [];
            const inFortune = w.sources && w.sources.inFortune;
            let badgeSource = '';
            if (bosses.length > 0) {
              badgeSource = `<span style="font-size:0.68rem;color:var(--accent-blue);background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.3);padding:1px 5px;border-radius:2px;" title="Выбивается с босса: ${bosses[0].bossTitle}">🏥 Босс</span>`;
            } else if (inFortune) {
              badgeSource = `<span style="font-size:0.68rem;color:var(--accent-gold);background:rgba(234,179,8,0.12);border:1px solid rgba(234,179,8,0.3);padding:1px 5px;border-radius:2px;" title="Падает в костях (Fortune)">🎲 Кости</span>`;
            }

            cardsHtml += `
              <div class="card" style="cursor:pointer;" onclick="openWeaponDetails(${w.id})" title="Подробнее об оружии, улучшении и источниках">
                <div style="display:flex;gap:0.65rem;align-items:center;">
                  <img src="${w.image || ''}" width="42" height="42" style="background:#000;border-radius:4px;border:1px solid var(--border);object-fit:contain;flex-shrink:0;" alt="${w.title}"/>
                  <div style="min-width:0;flex:1;">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.3rem;">
                      <span style="font-weight:700;color:#fff;font-size:0.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${w.title}">${w.title}</span>
                      ${badgeSource}
                    </div>
                    <div style="font-size:0.75rem;color:#f87171;font-weight:700;display:flex;align-items:center;gap:0.35rem;margin-top:2px;">
                      <span>⚔️ +${w.damage.toLocaleString()}</span>
                      <span style="font-size:0.68rem;color:var(--text-muted);font-weight:400;margin-left:auto;">#${w.id}</span>
                    </div>
                  </div>
                </div>
                <div style="font-size:0.74rem;display:flex;justify-content:space-between;color:var(--text-muted);margin-top:0.3rem;">
                  <span>${w.maxUseCount > 0 ? w.maxUseCount + ' уд.' : 'Бесконечно'}</span>
                  <span style="color:var(--accent-gold);font-weight:600;">${priceStr}</span>
                </div>
              </div>
            `;
          });
        }
      } else if (state.marketSection === 'clothes') {
        const categories = ['Майка', 'Штаны', 'Обувь', 'Перчатки', 'Головной убор', 'Маска', 'Аксессуары'];
        let filtered = allClothes.filter(c => {
          if (state.marketClothCategory !== 'all' && c.category !== state.marketClothCategory) return false;
          if (!matchCurr(c, state.marketCurrency)) return false;
          if (!q) return true;
          const matchTitle = c.title && c.title.toLowerCase().includes(q);
          const matchCat = c.category && c.category.toLowerCase().includes(q);
          const matchId = c.id.toString() === q;
          return matchTitle || matchCat || matchId;
        });

        filtered.sort((a, b) => {
          const statsA = (a.baseStats || []).reduce((acc, s) => acc + (s.count || 0), 0);
          const statsB = (b.baseStats || []).reduce((acc, s) => acc + (s.count || 0), 0);
          if (statsB !== statsA) return statsB - statsA;
          return (a.minLevel || 0) - (b.minLevel || 0);
        });

        activeFilteredCount = filtered.length;
        const catT = state.marketClothCategory === 'all' ? 'Все вещи' : state.marketClothCategory;
        const currT = getCurrTitle(state.marketCurrency);
        activeFiltersSummary = `${catT}${currT !== 'Все' ? ' • ' + currT : ''}`;

        sidebarHtml = `
          <div class="market-side-group">
            <div class="market-side-title">Слот гардероба</div>
            <button class="market-side-btn ${state.marketClothCategory === 'all' ? 'active' : ''}" onclick="state.marketClothCategory='all'; renderContent();">
              <span>Все вещи</span>

ator.clipboard.writeText) {\n      try { await navigator.clipboard.writeText(payload); copied = true; } catch(e) {}\n    }\n\n    const existing = document.getElementById('remadExportWidget');\n    if (existing) existing.remove();\n    const box = document.createElement('div');\n    box.id = 'remadExportWidget';\n    box.style.cssText = 'position:fixed;top:25px;right:25px;z-index:9999999;background:#090d16;color:#fff;border:2px solid #22c55e;padding:18px 22px;border-radius:10px;box-shadow:0 15px 40px rgba(0,0,0,0.95);max-width:380px;font-family:sans-serif;text-align:center;';\n    box.innerHTML = `\n      <div style=\"font-size:16px;font-weight:bold;color:#22c55e;margin-bottom:6px;\">\ud83e\uddec \u0414\u0430\u043d\u043d\u044b\u0435 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u044b!</div>\n      <div style=\"font-size:13px;color:#cbd5e1;margin-bottom:12px;\">\u0421\u043b\u043e\u0442\u043e\u0432 \u044d\u043a\u0438\u043f\u0438\u0440\u043e\u0432\u043a\u0438: <strong>${equipped.length}</strong> (\u0437\u0430\u043d\u044f\u0442\u043e: <span style=\"color:#c084fc;font-weight:bold;\">${occupiedCnt}</span>, \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e: <span style=\"color:#4ade80;font-weight:bold;\">${emptyCnt}</span>) | \u0418\u043d\u0432\u0435\u043d\u0442\u0430\u0440\u044c: ${inventory.length}</div>\n      <button id=\"remadCopyBtn\" style=\"background:#22c55e;color:#000;border:none;padding:12px 18px;border-radius:6px;font-weight:bold;font-size:14px;cursor:pointer;width:100%;box-shadow:0 4px 14px rgba(34,197,94,0.4);transition:0.2s;\">\n        ${copied ? '\u2705 \u0421\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043e \u0432 \u0431\u0443\u0444\u0435\u0440 (\u0438\u043b\u0438 \u043a\u043b\u0438\u043a\u043d\u0438\u0442\u0435 \u0435\u0449\u0435 \u0440\u0430\u0437)' : '\ud83d\udccb \u041d\u0430\u0436\u043c\u0438\u0442\u0435 \u0441\u044e\u0434\u0430, \u0447\u0442\u043e\u0431\u044b \u0441\u043a\u043e\u043f\u043     function copyExportScript(btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(EXPORT_DEVTOOLS_SCRIPT).then(() => {
          const orig = btn.innerHTML;
          btn.innerHTML = '✅ Скрипт скопирован в буфер!';
          btn.style.borderColor = '#22c55e';
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.borderColor = '';
          }, 3000);
        });
      } else {
        prompt('Скопируйте скрипт вручную:', EXPORT_DEVTOOLS_SCRIPT);

    function parseMutagenInput(text, enchants) {
      const idMap = {};
      const codeMap = {};
      (enchants || []).forEach(e => {
        idMap[e.id] = e;
        const code = e.title.replace('Мутаген ', '').trim().toLowerCase();
        codeMap[code] = e;
        codeMap[e.title.toLowerCase()] = e;
        codeMap[e.id.toString()] = e;
      });

      const inv = {};
      const equippedList = [];
      let playerStats = null;
      let playerName = '';

      const str = (text || '').trim();
      if (!str) return { inventory: inv, equipped: equippedList, playerStats, playerName };

      // Try JSON parsing
      if (str.startsWith('{') || str.startsWith('[')) {
        try {
          const parsed = JSON.parse(str);

          if (parsed && typeof parsed === 'object') {
            if (parsed.player) playerName = parsed.player;
            if (parsed.stats) playerStats = parsed.stats;
            if (parsed.state) {
              if (parsed.state.name) playerName = parsed.state.name;
              if (parsed.state.stat) playerStats = parsed.state.stat;
            }

            const ENCHANTABLE_CLOTH_SLOTS = new Set([10, 11, 12, 13, 17, 18, 19]);
            const clothMeta = {};
            ((window.GAME_DATA && window.GAME_DATA.clothes) || []).forEach(c => { clothMeta[c.id] = c; });
            const weaponMeta = {};
            ((window.GAME_DATA && window.GAME_DATA.weapons) || []).forEach(w => { weaponMeta[w.id] = w; });
            const playerSex = parsed.playerSex || parsed.state?.sex || parsed.sex || 'male';
            const placeholderIds = new Set([146, 1, 4, 8, 13, 58, 59, 61, 60, 76, 77, 256, 257, 569, 570, 63, 25]);

            const handleRawEquippedItem = (itemId, cat, hasEnc, eid) => {
              if (!hasEnc && placeholderIds.has(Number(itemId))) return;
              if (cat === 'ornament') return; // Татуировки не поддерживают мутагены

              if (cat === 'weapon') {
                if (hasEnc) {
                  equippedList.push({ itemId, category: 'weapon', enchantId: eid, isEmpty: false });
                } else {
                  if (weaponMeta[itemId]) {
                    equippedList.push({ itemId, category: 'weapon', enchantId: null, isEmpty: true });
                  }
                }
                return;
              }

              if (cat === 'cloth') {
                if (hasEnc) {
                  equippedList.push({ itemId, category: 'cloth', enchantId: eid, isEmpty: false });
                } else {
                  const meta = clothMeta[itemId];
                  if (meta && ENCHANTABLE_CLOTH_SLOTS.has(meta.slotId)) {
                    const title = meta.title || '';
                    if (!title.startsWith('Без ') && title !== 'Голые руки') {
                      if (!playerSex || !meta.sex || meta.sex === playerSex || meta.sex === 'all') {
                        equippedList.push({ itemId, category: 'cloth', enchantId: null, isEmpty: true });
                      }
                    }
                  }
                }
              }
            };

            if (parsed.equipped && Array.isArray(parsed.equipped)) {
              parsed.equipped.forEach(eq => {
                const eid = eq.enchantId ? Number(eq.enchantId) : (eq.id ? Number(eq.id) : null);
                const hasEnc = Boolean(eid && idMap[eid]);
                handleRawEquippedItem(eq.itemId, eq.category || 'cloth', hasEnc, eid);
              });
            } else {
              // Сканируем ВСЕ купленные вещи игрока (одежда + оружие: и надетые, и в гардеробе)
              const allClothMap = new Map();
              (parsed.state?.cloth || parsed.cloth || []).forEach(it => allClothMap.set(it.id, it));
              (parsed.state?.wardrobe?.cloth || parsed.wardrobe?.cloth || []).forEach(it => { if (!allClothMap.has(it.id)) allClothMap.set(it.id, it); });

              const allWeaponMap = new Map();
              (parsed.state?.weapon || parsed.weapon || []).forEach(it => allWeaponMap.set(it.id, it));
              (parsed.state?.wardrobe?.weapon || parsed.wardrobe?.weapon || []).forEach(it => { if (!allWeaponMap.has(it.id)) allWeaponMap.set(it.id, it); });

              allWeaponMap.forEach(it => {
                const eid = it.enchant && it.enchant.length > 0 && it.enchant[0].id ? Number(it.enchant[0].id) : null;
                const hasEnc = Boolean(eid && idMap[eid]);
                handleRawEquippedItem(it.id, 'weapon', hasEnc, eid);
              });

              allClothMap.forEach(it => {
                const eid = it.enchant && it.enchant.length > 0 && it.enchant[0].id ? Number(it.enchant[0].id) : null;
                const hasEnc = Boolean(eid && idMap[eid]);
                handleRawEquippedItem(it.id, 'cloth', hasEnc, eid);
              });
            }
          }

          function scan(obj) {
            if (Array.isArray(obj)) {
              obj.forEach(scan);
            } else if (obj && typeof obj === 'object') {
              if (obj.id != null && (obj.count != null || obj.amount != null)) {
                const eid = Number(obj.id);
                const cnt = Number(obj.count != null ? obj.count : obj.amount);
                if (idMap[eid] && cnt > 0) inv[eid] = (inv[eid] || 0) + cnt;
              } else if (obj.enchantId != null && obj.count != null) {
                const eid = Number(obj.enchantId);
                const cnt = Number(obj.count);
                if (idMap[eid] && cnt > 0) inv[eid] = (inv[eid] || 0) + cnt;
              } else {
                for (let k in obj) {
                  if (['cloth', 'weapon', 'ornament', 'wardrobe', 'equipped', 'stats', 'player'].includes(k)) continue;
                  const kClean = k.replace('Мутаген ', '').trim().toLowerCase();
                  if (codeMap[kClean] && typeof obj[k] === 'number' && obj[k] > 0) {
                    const eid = codeMap[kClean].id;
                    inv[eid] = (inv[eid] || 0) + obj[k];
                  } else {
                    scan(obj[k]);
                  }
                }
              }
            }
          }

          if (parsed.inventory) scan(parsed.inventory);
          else scan(parsed);

          if (Object.keys(inv).length > 0 || equippedList.length > 0) {
            return { inventory: inv, equipped: equippedList, playerStats, playerName };
          }
        } catch (e) {}
      }

      // Regex parsing (multiline or comma separated)
      const pattern = /(?:мутаген\s+)?([a-zA-Z]+)[-\s]*([0-9]+|s)[\s:=x\-]+([0-9]+)/gi;
      let m;
      while ((m = pattern.exec(str)) !== null) {
        const code = (m[1] + '-' + m[2]).toLowerCase();
        const cnt = parseInt(m[3], 10);
        if (codeMap[code] && cnt > 0) {
          const eid = codeMap[code].id;
          inv[eid] = (inv[eid] || 0) + cnt;
        }
      }

      return { inventory: inv, equipped: equippedList, playerStats, playerName };
    }

    function getEnchantStats(e) {
      let madness = 0;    // skill1 (Безумие)
      let aggression = 0; // skill2 (Агрессия)
      let fury = 0;       // skill3 (Ярость)
      (e.buffs || []).forEach(b => {
        (b.stats || []).forEach(s => {
          if (s.name === 'skill1') madness += s.count;
          if (s.name === 'skill2') aggression += s.count;
          if (s.name === 'skill3') fury += s.count;
        });
      });
      return {
        madness,
        aggression,
        fury,
        score: madness + aggression + fury,
        rankScore: (madness + aggression) * 1000 + fury
      };
    }

    function evaluateMutagenInventory(inv, enchants, numSlots = 15) {
      const items = [];
      const encMap = {};
      enchants.forEach(e => { encMap[e.id] = e; });

      for (let eid in inv) {
        const cnt = inv[eid];
        const e = encMap[eid];
        if (e && cnt > 0) {
          const st = getEnchantStats(e);
          for (let i = 0; i < cnt; i++) {
            items.push({
              id: e.id,
              title: e.title,
              score: st.score,
              rankScore: st.rankScore,
              madness: st.madness,
              aggression: st.aggression,
              fury: st.fury
            });
          }
        }
      }

      items.sort((a, b) => {
        if (b.rankScore !== a.rankScore) return b.rankScore - a.rankScore;
        if (b.madness !== a.madness) return b.madness - a.madness;
        if (b.aggression !== a.aggression) return b.aggression - a.aggression;
        return b.fury - a.fury;
      });

      const equipped = (numSlots != null && numSlots > 0) ? items.slice(0, numSlots) : items;
      return {
        totalScore: equipped.reduce((sum, x) => sum + x.score, 0),
        madness: equipped.reduce((sum, x) => sum + x.madness, 0),
        aggression: equipped.reduce((sum, x) => sum + x.aggression, 0),
        fury: equipped.reduce((sum, x) => sum + x.fury, 0),
        equipped,
        totalItemsCount: items.length
      };
    }

    function runMutagenOptimization(initialInv, enchants, exchanges, numSlots = 15, minStats = null) {
      let inv = Object.assign({}, initialInv);
      const steps = [];
      const encMap = {};
      const statsMap = {};
      const seriesLevels = {};

      enchants.forEach(e => {
        encMap[e.id] = e;
        statsMap[e.id] = getEnchantStats(e);
        const t = e.title.replace('Мутаген ', '').trim();
        if (t.includes('-')) {
          const parts = t.split('-');
          const sName = parts[0];
          const lvl = parseInt(parts[1], 10);
          if (!isNaN(lvl)) {
            if (!seriesLevels[sName]) seriesLevels[sName] = {};
            seriesLevels[sName][lvl] = e;
          }
        }
      });

      // Pre-sort all enchant IDs once by (rankScore, madness, aggression, fury) desc
      const sortedIds = enchants
        .map(e => e.id)
        .sort((idA, idB) => {
          const a = statsMap[idA], b = statsMap[idB];
          if (b.rankScore !== a.rankScore) return b.rankScore - a.rankScore;
          if (b.madness !== a.madness) return b.madness - a.madness;
          if (b.aggression !== a.aggression) return b.aggression - a.aggression;
          return b.fury - a.fury;
        });

      const fastEvalStats = (curInv) => {
        let rem = (numSlots != null && numSlots > 0) ? numSlots : null;
        let madness = 0, aggression = 0, fury = 0, totalScore = 0;
        for (let i = 0; i < sortedIds.length; i++) {
          const id = sortedIds[i];
          const c = curInv[id] || 0;
          if (c <= 0) continue;
          const take = (rem == null || c < rem) ? c : rem;
          const st = statsMap[id];
          madness += take * st.madness;
          aggression += take * st.aggression;
          fury += take * st.fury;
          totalScore += take * st.rankScore;
          if (rem != null) {
            rem -= take;
            if (rem <= 0) break;
          }
        }
        return { madness, aggression, fury, totalScore };
      };

      const meetsMinStats = (ev) => {
        if (!minStats) return true;
        return ev.madness >= minStats.madness && ev.aggression >= minStats.aggression && ev.fury >= minStats.fury;
      };

      const seriesList = ['A', 'F', 'Z', 'W', 'X', 'S', 'I'];
      const synthCandidates = [];
      for (let s of seriesList) {
        if (!seriesLevels[s]) continue;
        for (let lvl = 1; lvl < 20; lvl++) {
          const cEnc = seriesLevels[s][lvl];
          const nEnc = seriesLevels[s][lvl + 1];
          if (!cEnc || !nEnc) continue;
          synthCandidates.push({
            cid: cEnc.id,
            nid: nEnc.id,
            lvl,
            desc: `Синтез: 5 шт. «${cEnc.title}» ➔ 1 шт. «${nEnc.title}»`,
            cost: (nEnc.price && nEnc.price.currency3) != null ? nEnc.price.currency3 : 0
          });
        }
      }

      const exCandidates = [];
      (exchanges || []).forEach(ex => {
        const rec = ex.recipe || [];
        if (rec.length < 2) return;
        const drops = ex.drops || [];
        const inStr = rec.map(r => `${r.count}x ${encMap[r.id] ? encMap[r.id].title : r.id}`).join(' + ');
        const outStr = drops.map(d => `${d.count}x ${encMap[d.id] ? encMap[d.id].title : d.id}`).join(' + ');
        const createsHybrid = drops.some(d => {
          const title = encMap[d.id] ? encMap[d.id].title : '';
          return title.includes('Z-') || title.includes('W-');
        });
        exCandidates.push({
          rec,
          drops,
          createsHybrid,
          desc: `Обмен в Лаборатории (вкладка «Обмен»): ${inStr} ➔ ${outStr}`,
          cost: (ex.price && ex.price.currency3) != null ? ex.price.currency3 : 50
        });
      });

      let iteration = 0;
      while (iteration < 200) {
        iteration++;
        const currScore = fastEvalStats(inv).totalScore;

        let bestAction = null;
        let bestDelta = -999999;

        // 1. Candidate standard syntheses (5 -> 1)
        for (let i = 0; i < synthCandidates.length; i++) {
          const sc = synthCandidates[i];
          if ((inv[sc.cid] || 0) >= 5) {
            inv[sc.cid] -= 5;
            inv[sc.nid] = (inv[sc.nid] || 0) + 1;
            const testEv = fastEvalStats(inv);
            const delta = testEv.totalScore - currScore;
            const okMin = meetsMinStats(testEv);
            inv[sc.cid] += 5;
            inv[sc.nid] -= 1;

            if (!okMin) continue;
            if (numSlots != null) {
              if (delta > bestDelta) {
                bestDelta = delta;
                bestAction = { kind: 'synth', ref: sc, delta };
              }
            } else {
              const unlimVal = sc.lvl * 10;
              if (unlimVal > bestDelta) {
                bestDelta = unlimVal;
                bestAction = { kind: 'synth', ref: sc, delta };
              }
            }
          }
        }

        // 2. Candidate exchanges (Обмен мутагенов в Лаборатории начиная с 10 ур.)
        for (let i = 0; i < exCandidates.length; i++) {
          const ex = exCandidates[i];
          if (ex.rec.every(r => (inv[r.id] || 0) >= r.count)) {
            for (let j = 0; j < ex.rec.length; j++) inv[ex.rec[j].id] -= ex.rec[j].count;
            for (let j = 0; j < ex.drops.length; j++) inv[ex.drops[j].id] = (inv[ex.drops[j].id] || 0) + ex.drops[j].count;
            const testEv = fastEvalStats(inv);
            const delta = testEv.totalScore - currScore;
            const okMin = meetsMinStats(testEv);
            for (let j = 0; j < ex.rec.length; j++) inv[ex.rec[j].id] += ex.rec[j].count;
            for (let j = 0; j < ex.drops.length; j++) inv[ex.drops[j].id] -= ex.drops[j].count;

            if (!okMin) continue;
            if (numSlots != null) {
              const effectiveDelta = delta + (ex.createsHybrid && delta >= 0 ? 0.01 : 0);
              if (effectiveDelta > 0 && effectiveDelta > bestDelta) {
                bestDelta = effectiveDelta;
                bestAction = { kind: 'ex', ref: ex, delta };
              }
            } else {
              if (delta >= 0 && delta > bestDelta) {
                bestDelta = delta;
                bestAction = { kind: 'ex', ref: ex, delta };
              }
            }
          }
        }

        if (bestAction && (bestDelta > 0 || (numSlots == null && bestDelta > -999))) {
          if (bestAction.kind === 'synth') {
            const sc = bestAction.ref;
            inv[sc.cid] -= 5;
            inv[sc.nid] = (inv[sc.nid] || 0) + 1;
            steps.push({ type: 'synthesis', desc: sc.desc, delta: bestAction.delta, cost: sc.cost });
          } else {
            const ex = bestAction.ref;
            for (let j = 0; j < ex.rec.length; j++) inv[ex.rec[j].id] -= ex.rec[j].count;
            for (let j = 0; j < ex.drops.length; j++) inv[ex.drops[j].id] = (inv[ex.drops[j].id] || 0) + ex.drops[j].count;
            steps.push({ type: 'exchange', desc: ex.desc, delta: bestAction.delta, cost: ex.cost });
          }
        } else if (numSlots != null) {
          let harmlessFound = false;
          for (let i = 0; i < synthCandidates.length; i++) {
            const sc = synthCandidates[i];
            if ((inv[sc.cid] || 0) >= 5) {
              inv[sc.cid] -= 5;
              inv[sc.nid] = (inv[sc.nid] || 0) + 1;
              const testEv = fastEvalStats(inv);
              const delta = testEv.totalScore - currScore;
              if (delta >= 0 && meetsMinStats(testEv)) {
                steps.push({ type: 'synthesis', desc: sc.desc, delta, cost: sc.cost });
                harmlessFound = true;
                break;
              }
              inv[sc.cid] += 5;
              inv[sc.nid] -= 1;
            }
          }
          if (!harmlessFound) {
            for (let i = 0; i < exCandidates.length; i++) {
              const ex = exCandidates[i];
              if (ex.rec.every(r => (inv[r.id] || 0) >= r.count)) {
                for (let j = 0; j < ex.rec.length; j++) inv[ex.rec[j].id] -= ex.rec[j].count;
                for (let j = 0; j < ex.drops.length; j++) inv[ex.drops[j].id] = (inv[ex.drops[j].id] || 0) + ex.drops[j].count;
                const testEv = fastEvalStats(inv);
                const delta = testEv.totalScore - currScore;
                if (delta >= 0 && meetsMinStats(testEv)) {
                  steps.push({ type: 'exchange', desc: ex.desc, delta, cost: ex.cost });
                  harmlessFound = true;
                  break;
                }
                for (let j = 0; j < ex.rec.length; j++) inv[ex.rec[j].id] += ex.rec[j].count;
                for (let j = 0; j < ex.drops.length; j++) inv[ex.drops[j].id] -= ex.drops[j].count;
              }
            }
          }
          if (!harmlessFound) break;
        } else {
          break;
        }
      }

      const groupedSteps = [];
      steps.forEach(s => {
        const last = groupedSteps[groupedSteps.length - 1];
        if (last && last.desc === s.desc) {
          last.repeatCount = (last.repeatCount || 1) + 1;
          last.delta += s.delta;
          last.totalCost = (last.totalCost || last.cost || 0) + (s.cost || 0);
        } else {
          groupedSteps.push(Object.assign({}, s, { repeatCount: 1, totalCost: s.cost || 0 }));
        }
      });

      return {
        optimizedInv: inv,
        steps: groupedSteps
      };
    }

    function calculateMutagenOptimization() {
      const data = window.GAME_DATA;
      const enchants = (data.mutagens && data.mutagens.enchants) || [];
      const exchanges = (data.mutagens && data.mutagens.exchanges) || [];

      const raw = document.getElementById('calcInputText') ? document.getElementById('calcInputText').value : state.calcRawInput;
      state.calcRawInput = raw;

      const parsed = parseMutagenInput(raw, enchants);
      if (Object.keys(parsed.inventory).length > 0 || parsed.equipped.length > 0) {
        state.calcUserInv = parsed.inventory;
        state.calcEquippedItems = parsed.equipped;
        if (parsed.playerStats) state.calcPlayerStats = parsed.playerStats;
        if (parsed.playerName) state.calcPlayerName = parsed.playerName;
      }

      const userInv = state.calcUserInv || {};
      const equippedItems = state.calcEquippedItems || [];
      const occupiedSlots = equippedItems.filter(s => !s.isEmpty && s.enchantId);
      const emptySlots = equippedItems.filter(s => s.isEmpty || !s.enchantId);

      if (Object.keys(userInv).length === 0 && equippedItems.length === 0) {
        alert('Пожалуйста, вставьте данные мутагенов из игры или нажмите «Загрузить пример».');
        return;
      }

      // Количество слотов определяется ИСКЛЮЧИТЕЛЬНО из загруженных вещей игрока (занятые + пустые)
      const numSlots = (state.calcMode === 'slots') ? (equippedItems.length > 0 ? equippedItems.length : 15) : null;
      state.calcSlots = numSlots || 15;

      const encMap = {};
      enchants.forEach(e => { encMap[e.id] = e; });

      // Оценка текущего состояния экипировки игрока (базовые статы от уже установленных мутагенов)
      const currentEquippedItems = occupiedSlots.map(s => {
        const e = encMap[s.enchantId];
        const st = getEnchantStats(e);
        return {
          id: e.id,
          title: e.title,
          score: st.score,
          madness: st.madness,
          aggression: st.aggression,
          fury: st.fury
        };
      });

      const currentEquippedEval = {
        totalScore: currentEquippedItems.reduce((sum, x) => sum + x.score, 0),
        madness: currentEquippedItems.reduce((sum, x) => sum + x.madness, 0),
        aggression: currentEquippedItems.reduce((sum, x) => sum + x.aggression, 0),
        fury: currentEquippedItems.reduce((sum, x) => sum + x.fury, 0),
        equipped: currentEquippedItems,
        totalItemsCount: currentEquippedItems.length
      };

      function evaluateMode(modeType) {
        let pool = Object.assign({}, userInv);
        let extractionCost = 0;
        const extractedCounts = {};

        // В режиме извлечения достаем мутагены ТОЛЬКО из занятых слотов
        if (modeType === 'extract' && occupiedSlots.length > 0) {
          occupiedSlots.forEach(eq => {
            const eid = eq.enchantId;
            pool[eid] = (pool[eid] || 0) + 1;
            extractedCounts[eid] = (extractedCounts[eid] || 0) + 1;
            const enc = encMap[eid];
            const p = (enc && enc.price && enc.price.currency3 != null) ? enc.price.currency3 : 0;
            extractionCost += p;
          });
        }

        // Если в экипировке есть мутагены, "было" - это текущие вставленные в вещи мутагены
        const beforeEval = (occupiedSlots.length > 0) ? currentEquippedEval : evaluateMutagenInventory(pool, enchants, numSlots);
        const minStats = (modeType === 'extract' && occupiedSlots.length > 0)
          ? { madness: beforeEval.madness, aggression: beforeEval.aggression, fury: beforeEval.fury }
          : null;
        const opt = runMutagenOptimization(pool, enchants, exchanges, numSlots, minStats);
        const afterEval = evaluateMutagenInventory(opt.optimizedInv, enchants, numSlots);

        const totalSynthesisCost = opt.steps.reduce((acc, s) => acc + (s.totalCost || 0), 0);
        // Стоимость установки каждого нового рекомендованного мутагена по его цене
        const totalSocketCost = (numSlots != null) ? afterEval.equipped.reduce((sum, it) => {
          const e = encMap[it.id];
          const cost = (e && e.price && e.price.currency3 != null) ? e.price.currency3 : 1;
          return sum + cost;
        }, 0) : 0;
        const grandTotalCost = totalSynthesisCost + totalSocketCost + extractionCost;

        return {
          modeType,
          pool,
          extractionCost,
          extractedCounts,
          before: beforeEval,
          after: afterEval,
          steps: opt.steps,
          optimizedInv: opt.optimizedInv,
          totalSynthesisCost,
          totalSocketCost,
          grandTotalCost
        };
      }

      const extractPlan = evaluateMode('extract');
      const replacePlan = evaluateMode('replace');
      const activePlan = (state.calcEquippedMode === 'replace') ? replacePlan : extractPlan;

      state.calcResult = {
        active: activePlan,
        extractPlan,
        replacePlan,
        totalSlots: numSlots,
        occupiedSlotsCount: occupiedSlots.length,
        emptySlotsCount: emptySlots.length
      };

      renderContent();
    }

    function setCalcEquippedMode(mode) {
      state.calcEquippedMode = mode;
      if (state.calcResult) {
        state.calcResult.active = (mode === 'replace') ? state.calcResult.replacePlan : state.calcResult.extractPlan;
      }
      renderContent();
    }
