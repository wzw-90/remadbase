            function renderInventory(data, q) {
      UI.controls.innerHTML = '';
      const collections = data.collections || [];
      renderStashesView(collections, q);
    }

    function renderStashesView(collections, q) {
      let filtered = collections;
      if (q) {
        filtered = collections.filter(c => {
          const matchTitle = c.title && c.title.toLowerCase().includes(q);
          const matchId = c.id.toString() === q || c.stashId.toString() === q;
          const matchElem = (c.elements || []).some(e => e.title && e.title.toLowerCase().includes(q));
          return matchTitle || matchId || matchElem;
        });
      }

      let html = `
        <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.65rem;">
          Показано заначек: ${filtered.length} из ${collections.length} • Слева заначка, справа необходимые элементы для её сбора
        </div>
        <div class="stashes-list">
      `;

      if (filtered.length === 0) {
        html += `<div style="text-align:center;padding:2rem;color:var(--text-muted);background:#0f141d;border:1px solid #1e2838;border-radius:var(--radius-md);">Заначки не найдены</div>`;
      } else {
        filtered.forEach(c => {
          const sp = c.sellPrice || {};
          const priceBadge = sp.currency1 ? `
            <div class="stash-price">💰 ${sp.currency1.toLocaleString()} мон.</div>` : '';

          const floorBadge = c.floor ? `
            <div style="font-size:0.72rem;color:#38bdf8;margin-top:0.2rem;">
              📍 <a href="javascript:void(0)" class="element-source-link" onclick="openFloorDetails(${c.floor.locId})" title="Дежурства: этаж ${c.floor.title} (${c.floor.name})">Этаж ${c.floor.title}</a>
            </div>` : `
            <div style="font-size:0.72rem;color:#c084fc;margin-top:0.2rem;">
              💀 Крафт / Дроп с боссов
            </div>`;

          let rewardLabel = '';
          if (c.reward) {
            if (c.reward.startsWith('Крафт') || c.reward.startsWith('Комплект') || c.reward.startsWith('Предмет')) {
              rewardLabel = `✨ ${c.reward}`;
            } else if (c.reward.startsWith('+')) {
              rewardLabel = `✨ Награда: ${c.reward}`;
            } else {
              rewardLabel = `✨ Эффект: ${c.reward}`;
            }
          }

          const rewardBadge = rewardLabel ? `
            <div style="font-size:0.72rem;color:var(--accent-green);margin-top:0.25rem;font-weight:600;line-height:1.35;">
              ${rewardLabel}
            </div>` : '';

          html += `
            <div class="stash-row">
              <div class="stash-left">
                <div class="stash-icon-frame">
                  <img src="${c.image}" alt="${c.title}" onerror="this.src='images/ui/unknown.png'"/>
                </div>
                <div class="stash-meta">
                  <div class="stash-title">${c.title}</div>
                  ${priceBadge}
                  ${floorBadge}
                  ${rewardBadge}
                </div>
              </div>

              <div class="stash-arrow">➔</div>

              <div class="stash-elements-row ${(c.elements || []).length === 1 ? 'single-element' : ''}">
                ${(c.elements || []).map(e => {
                  let sourceHtml = '—';
                  if (e.source && e.source.type === 'floor') {
                    sourceHtml = `🏥 <a href="javascript:void(0)" class="element-source-link" onclick="openFloorDetails(${e.source.locId})" title="Дежурства: этаж ${e.source.locTitle} (${e.source.locName})">Этаж ${e.source.locTitle}</a>`;
                  } else if (e.source && e.source.type === 'boss') {
                    sourceHtml = `💀 <a href="javascript:void(0)" class="element-source-link" onclick="openBossDetails(${e.source.bossId})" title="Босс: ${e.source.bossTitle}">${e.source.bossTitle}</a>`;
                  } else if (e.sourceLabel) {
                    sourceHtml = e.sourceLabel;
                  }

                  const totalCount = (c.elements || []).length || 1;

                  return `
                    <div class="element-slot" title="${e.title}">
                      <div class="element-num-badge">${e.index}/${totalCount}</div>
                      <div class="element-img-frame">
                        <img src="${e.image}" alt="${e.title}" onerror="this.src='images/ui/unknown.png'"/>
                      </div>
                      <div class="element-name">${e.title}</div>
                      <div class="element-source">${sourceHtml}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      UI.content.innerHTML = html;
    }

    function renderEventItemsView(eventItems, data, q) {
      let filtered = eventItems;
      if (q) {
        filtered = eventItems.filter(i => {
          return (i.title && i.title.toLowerCase().includes(q)) || i.id.toString() === q;
        });
      }

      // Map boss drop sources
      const bossDropsMap = {};
      (data.bosses || []).forEach(b => {
        (b.drops || []).forEach(d => {
          if (d.type === 'inventory') {
            if (!bossDropsMap[d.id]) bossDropsMap[d.id] = [];
            bossDropsMap[d.id].push({ id: b.id, title: b.title, prob: d.probability || d.prob || 100 });
          }
        });
      });

      let html = `
        <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.65rem;">
          Показано ивентовых и квестовых предметов: ${filtered.length} из ${eventItems.length}
        </div>
        <div class="event-items-grid">
      `;

      if (filtered.length === 0) {
        html += `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted);background:#0f141d;border:1px solid #1e2838;border-radius:var(--radius-md);">Предметы не найдены</div>`;
      } else {
        filtered.forEach(i => {
          const sp = i.sellPrice || {};
          const priceText = sp.currency1 ? `${sp.currency1} мон.` : 'Не продается';
          const bossSources = bossDropsMap[i.id] || [];

          let dropBadge = '';
          if (bossSources.length > 0) {
            const first = bossSources[0];
            const extra = bossSources.length > 1 ? ` +${bossSources.length - 1}` : '';
            dropBadge = `<div style="font-size:0.68rem;color:#38bdf8;margin-top:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              💀 <a href="javascript:void(0)" class="drop-link" onclick="openBossDetails(${first.id})" title="${first.title}">${first.title} (${first.prob}%)${extra}</a>
            </div>`;
          }

          html += `
            <div class="event-item-card">
              <div class="event-item-img">
                <img src="${i.image || ''}" alt="${i.title}" onerror="this.src='images/ui/unknown.png'"/>
              </div>
              <div style="min-width:0;flex:1;">
                <div style="font-size:0.8rem;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${i.title}">
                  ${i.title}
                </div>
                <div style="font-size:0.68rem;color:var(--accent-gold);margin-top:0.1rem;">
                  ${priceText}
                </div>
                ${dropBadge}
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      UI.content.innerHTML = html;
    }

    function openFloorDetails(locId) {
      const data = window.GAME_DATA;
      const loc = (data.locations || []).find(l => l.id === locId);
      if (!loc) return;
      const zone = (data.zones || []).find(z => z.id === loc.zoneId);
      if (zone) state.activeZoneCode = zone.code;
      state.activeLocationId = locId;
      state.openedCorps[locId] = true;
      state.tab = 'floors';
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const ft = document.querySelector('.nav-tab[data-tab="floors"]');
      if (ft) ft.classList.add('active');
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openStashByTitle(stashTitle) {
      closeModal();
      state.tab = 'inventory';
      state.inventoryCategory = 'stashes';
      state.search = stashTitle;
      UI.search.value = stashTitle;
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const it = document.querySelector('.nav-tab[data-tab="inventory"]');
      if (it) it.classList.add('active');
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleModalMutagens(btn) {
      const container = document.getElementById('modal_mutagens_container');
      if (!container) return;
      const isHidden = container.style.display === 'none';
      container.style.display = isHidden ? 'block' : 'none';
      const arrow = btn.querySelector('.modal-mut-arrow');
      if (arrow) arrow.textContent = isHidden ? 'Свернуть ▲' : 'Развернуть ▼';
      btn.style.borderColor = isHidden ? '#38bdf8' : '#233145';
      btn.style.background = isHidden ? '#1b2434' : '#141b27';
    }

    /* Modal */
    function openBossDetails(bossId) {
      const data = window.GAME_DATA;
      const b = data.bosses.find(x => x.id === bossId);
      if (!b) return;

      const loc = data.locations.find(l => l.id === b.locationId);
      const zone = loc ? data.zones.find(z => z.id === loc.zoneId) : null;

      UI.modalTitle.textContent = `#${b.id} ${b.title}`;

      let bodyHtml = `
        ${b.previewImage ? `<img src="${b.previewImage}" class="modal-preview-img" alt="${b.title}" onerror="this.style.display='none'"/>` : ''}
        ${b.description ? `<p style="color:var(--text-muted);font-size:0.84rem;line-height:1.4;">${b.description}</p>` : ''}
        
        <table class="modal-table">
          <tr><th>Корпус</th><td>${loc ? (loc.title + (loc.name ? ' — ' + loc.name : '')) : '#' + b.locationId} ${zone ? `(${zone.title})` : ''}</td></tr>
          <tr><th>Здоровье</th><td style="color:#f87171;font-weight:700;">${b.health.toLocaleString()} HP</td></tr>
          <tr><th>Урон</th><td>${b.damageMin} – ${b.damageMax}</td></tr>
          <tr><th>Время боя</th><td>${b.durationMinutes} мин</td></tr>
          <tr><th>Опыт</th><td style="color:var(--accent-purple);font-weight:600;">+${b.xp.toLocaleString()} XP</td></tr>
          <tr><th>Условия</th><td>${b.needsText || 'Нет'}</td></tr>
          ${b.artifactTitle ? `<tr><th>Квестовый итем</th><td><strong>${(() => {
            const artItem = (data.inventory || []).find(i => i.title.trim().toLowerCase() === b.artifactTitle.trim().toLowerCase());
            if (artItem) {
              return `<a href="javascript:void(0)" class="drop-link" onclick="openEventItemDetails(${artItem.id}, ${b.id})" title="Открыть карточку предмета: ${b.artifactTitle}">${b.artifactTitle}</a> (100%)`;
            }
            return `${b.artifactTitle} (100%)`;
          })()}</strong></td></tr>` : ''}
        </table>

        <div>
          <div style="font-size:0.8rem;font-weight:700;margin-bottom:0.35rem;color:#fff;">Шансы дропа:</div>
          ${(() => {
            const artLower = (b.artifactTitle || '').trim().toLowerCase();
            const validDrops = (b.drops || []).filter(d => !artLower || d.title.trim().toLowerCase() !== artLower);
            const mainDrops = validDrops.filter(d => !d.title.includes('Мутаген'));
            const mutagenDrops = validDrops.filter(d => d.title.includes('Мутаген'));

            function renderRows(list) {
              return list.map(d => {
                let itemHtml = d.title;
                if (d.type === 'access_weapon') {
                  const cleanTitle = d.title.replace(/^Доступ:\s*/, '');
                  itemHtml = `🔑 <a href="javascript:void(0)" class="drop-link" onclick="openWeaponDetails(${d.id}, ${b.id})" title="Открыть характеристики и улучшение оружия">${cleanTitle}</a>`;
                } else if (d.type === 'access_cloth') {
                  const cleanTitle = d.title.replace(/^Доступ:\s*/, '');
                  itemHtml = `🔑 <a href="javascript:void(0)" class="drop-link" onclick="openClothDetails(${d.id}, ${b.id})" title="Открыть информацию об одежде">${cleanTitle}</a>`;
                } else if (d.type === 'access_ornament') {
                  const cleanTitle = d.title.replace(/^Доступ:\s*/, '').replace(/^Тату\s*/, '');
                  itemHtml = `🔑 <a href="javascript:void(0)" class="drop-link" onclick="openTattooDetails(${d.id}, ${b.id})" title="Открыть информацию о татуировке">${cleanTitle}</a>`;
                } else if (d.type && d.type.startsWith('access_')) {
                  itemHtml = '🔑 ' + d.title;
                } else if (d.collectionTitle || (d.title && d.title.startsWith('Заначка '))) {
                  const cTitle = d.collectionTitle || (d.title.match(/«([^»]+)»/) ? d.title.match(/«([^»]+)»/)[1] : '');
                  itemHtml = `📦 <a href="javascript:void(0)" class="drop-link" onclick="openStashByTitle('${cTitle.replace(/'/g, "\\'")}')" title="Открыть заначку «${cTitle}» в инвентаре">${d.title}</a>`;
                } else if (d.type === 'inventory') {
                  itemHtml = `<a href="javascript:void(0)" class="drop-link" onclick="openEventItemDetails(${d.id}, ${b.id})" title="Открыть информацию о предмете">${d.title}</a>`;
                }
                return `
                  <tr>
                    <td>${itemHtml}</td>
                    <td>${d.count != null ? d.count : 1}</td>
                    <td style="color:var(--accent-gold);font-weight:700;">${d.probability}%</td>
                  </tr>
                `;
              }).join('');
            }

            let out = '';
            if (mainDrops.length > 0) {
              out += `
                <table class="modal-table">
                  <thead><tr><th>Предмет</th><th>Кол-во</th><th>Шанс</th></tr></thead>
                  <tbody>${renderRows(mainDrops)}</tbody>
                </table>
              `;
            } else {
              out += `<div style="font-size:0.75rem;color:var(--text-muted);padding:0.4rem 0;">Нет постоянного дропа экипировки</div>`;
            }

            if (mutagenDrops.length > 0) {
              out += `
                <div style="margin-top:0.75rem;">
                  <button type="button" class="modal-mutagens-btn" onclick="toggleModalMutagens(this)" style="
                    background: #141b27;
                    border: 1px solid #233145;
                    color: #38bdf8;
                    padding: 0.45rem 0.75rem;
                    border-radius: var(--radius-sm);
                    font-size: 0.76rem;
                    font-weight: 600;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    width: 100%;
                    box-sizing: border-box;
                    transition: all 0.15s ease;
                  ">
                    <span>🧪 Мутагены (${mutagenDrops.length})</span>
                    <span class="modal-mut-arrow">Развернуть ▼</span>
                  </button>
                  <div id="modal_mutagens_container" style="display:none;margin-top:0.35rem;">
                    <table class="modal-table">
                      <thead><tr><th>Мутаген</th><th>Кол-во</th><th>Шанс</th></tr></thead>
                      <tbody>${renderRows(mutagenDrops)}</tbody>
                    </table>
                  </div>
                </div>
              `;
            }

            return out;
          })()}
        </div>
      `;

      UI.modalBody.innerHTML = bodyHtml;
      UI.modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openWeaponDetails(weaponId, fromBossId = null) {
      const data = window.GAME_DATA;
      const w = data.weapons.find(x => x.id === weaponId);
      if (!w) return;

      UI.modalTitle.textContent = `${w.title} (#${w.id})`;

      function plural(n, one, few, many) {
        if (!n) return '';
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod100 >= 11 && mod100 <= 14) return `${n.toLocaleString()} ${many}`;
        if (mod10 === 1) return `${n.toLocaleString()} ${one}`;
        if (mod10 >= 2 && mod10 <= 4) return `${n.toLocaleString()} ${few}`;
        return `${n.toLocaleString()} ${many}`;
      }

      function formatHits(n) {
        if (!n || n <= 0) return 'Бесконечно (не ломается)';
        return plural(n, 'удар', 'удара', 'ударов');
      }

      const p = w.price || {};
      const priceStr = [
        p.currency1 ? plural(p.currency1, 'монета', 'монеты', 'монет') : '',
        p.currency2 ? plural(p.currency2, 'купюра', 'купюры', 'купюр') : '',
        p.currency3 ? plural(p.currency3, 'таблетка', 'таблетки', 'таблеток') : ''
      ].filter(Boolean).join(', ') || 'Бесплатно';

      const rp = w.rechargePrice || {};
      const rechargeStr = [
        rp.currency1 ? plural(rp.currency1, 'монета', 'монеты', 'монет') : '',
        rp.currency2 ? plural(rp.currency2, 'купюра', 'купюры', 'купюр') : '',
        rp.currency3 ? plural(rp.currency3, 'таблетка', 'таблетки', 'таблеток') : ''

      // Upgrade section

        upgradeHtml = `

              <div>• <strong>Бонус за 1 уровень:</strong> ${statsStr}</div>
              ${upg.maxLevel > 1 ? `<div>• <strong>Суммарный бонус на ${upg.maxLevel} ур.:</strong> ${totalMaxStr}</div>` : ''}
            </div>

            <div style="margin-top:0.6rem;font-size:0.78rem;font-weight:700;color:#fff;">Чем и с каким шансом улучшать:</div>
            <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:0.4rem;margin-top:0.4rem;">

                <div style="font-size:1rem;font-weight:700;color:#38bdf8;margin:2px 0;font-family:var(--font-mono);">~55%</div>
                <div style="font-size:0.67rem;color:var(--text-muted);">Средний шанс</div>
              </div>
              <div style="background:#090d16;border:1px solid rgba(16,185,129,0.4);border-radius:4px;padding:0.45rem 0.35rem;text-align:center;">
                <div style="font-size:0.72rem;color:var(--accent-green);font-weight:600;">💵 За купюры</div>
                <div style="font-size:1rem;font-weight:700;color:#34d399;margin:2px 0;font-family:var(--font-mono);">100%</div>
                <div style="font-size:0.67rem;color:#10b981;">Без риска</div>
              </div>
            </div>
          </div>
        `;
      } else {
        upgradeHtml = `
          <div style="margin-top:0.8rem;background:rgba(255,255,255,0.02);border:1px solid #1e293b;border-radius:4px;padding:0.6rem;font-size:0.8rem;color:var(--text-muted);">
            ℹ️ Данное оружие не имеет уровней улучшения в мастерской.
          </div>
        `;
      }

      // Sources section
      let sourcesHtml = '';
      const bosses = (w.sources && w.sources.bosses) || [];
      const inFortune = w.sources && w.sources.inFortune;

      if (bosses.length > 0 || inFortune) {
        sourcesHtml = `
          <div style="margin-top:0.85rem;background:rgba(255,255,255,0.03);border:1px solid #1e293b;border-radius:4px;padding:0.75rem;">

              📍 Источники получения:
            </div>
            ${bosses.length > 0 ? `
              <div style="margin-bottom:${inFortune ? '0.6rem' : '0'};">

                <div style="display:flex;flex-direction:column;gap:0.35rem;">
                  ${bosses.map(b => `
                    <div style="display:flex;justify-content:space-between;align-items:center;background:#090d16;border:1px solid #252f42;border-radius:3px;padding:0.4rem 0.6rem;font-size:0.78rem;">
                      <div>
                        <button style="background:none;border:none;color:#fff;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-align:left;" onclick="closeModal(); openBossDetails(${b.bossId});" title="Открыть досье босса">
                          ${b.bossTitle} &rarr;
                        </button>
                        <span style="color:var(--accent-blue);font-size:0.73rem;margin-left:0.4rem;">(Корпус ${b.locationTitle}${b.locationName ? ' — ' + b.locationName : ''})</span>
                      </div>
                      <span style="color:var(--accent-gold);font-weight:700;font-family:var(--font-mono);">${b.probability}%</span>
                    </div>
                  `).join('')}

              </div>
            ` : ''}

            ${inFortune ? `
              <div style="display:flex;align-items:center;gap:0.6rem;background:#090d16;border:1px solid rgba(234,179,8,0.3);border-radius:3px;padding:0.5rem 0.65rem;font-size:0.8rem;color:#facc15;">

                <div>
                  <div style="font-weight:700;color:#fff;">Падает в костях (Fortune)</div>
                  <div style="font-size:0.72rem;color:var(--text-muted);margin-top:1px;">Выпадает в мини-игре «Кости» при сборе счастливых комбинаций кубиков</div>

            &larr; Назад к боссу #${boss.id} (${boss.title})

        </div>
      ` : '';

      let bodyHtml = `
        ${backBtnHtml}
        <div style="display:flex;gap:1rem;align-items:center;margin-bottom:0.8rem;">
          <img src="${w.image || ''}" width="80" height="80" style="background:#000;border:1px solid #4a5870;border-radius:4px;object-fit:contain;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,0.7);" alt="${w.title}"/>
          <div>
            <div style="font-size:1.15rem;font-weight:700;color:#fff;font-family:var(--font-header);">${w.title}</div>
            <div style="font-size:0.85rem;color:#f87171;font-weight:700;margin-top:3px;">Урон оружия: +${w.damage.toLocaleString()}</div>
            <div style="font-size:0.74rem;color:var(--text-muted);margin-top:2px;">Идентификатор в базе: #${w.id}</div>

        </div>

        <table class="modal-table">
          <tr><th>Урон</th><td style="color:#f87171;font-weight:700;">+${w.damage.toLocaleString()}</td></tr>
          <tr><th>Количество ударов</th><td>${formatHits(w.maxUseCount)}</td></tr>
          <tr><th>Цена покупки</th><td style="color:var(--accent-gold);font-weight:600;">${priceStr}</td></tr>
          <tr><th>Цена перезарядки</th><td>${rechargeStr}</td></tr>

        if (mod10 === 1) return `${n.toLocaleString()} ${one}`;
        if (mod10 >= 2 && mod10 <= 4) return `${n.toLocaleString()} ${few}`;
        return `${n.toLocaleString()} ${many}`;
      }

      const p = t.price || {};
      const priceStr = [
        p.currency1 ? plural(p.currency1, 'монета', 'монеты', 'монет') : '',
        p.currency2 ? plural(p.currency2, 'купюра', 'купюры', 'купюр') : '',
        p.currency3 ? plural(p.currency3, 'таблетка', 'таблетки', 'таблеток') : ''
      ].filter(Boolean).join(', ') || 'Бесплатно / Не продается';

      const boss = fromBossId ? data.bosses.find(x => x.id === fromBossId) : null;
      const backBtnHtml = boss ? `
        <div style="margin-bottom:0.75rem;">
          <button class="weapon-filter-btn" style="padding:0.32rem 0.75rem;font-size:0.76rem;" onclick="openBossDetails(${boss.id})">
            &larr; Назад к боссу #${boss.id} (${boss.title})
          </button>
        </div>
      ` : '';

      const bossesMap = {};
      (t.sources && t.sources.bosses || []).forEach(b => {
        if (!bossesMap[b.bossId]) bossesMap[b.bossId] = b;
      });
      const bosses = Object.values(bossesMap);

      let sourcesHtml = '';
      if (bosses.length > 0) {
        sourcesHtml = `
          <div style="margin-top:0.85rem;background:rgba(255,255,255,0.03);border:1px solid #1e293b;border-radius:4px;padding:0.75rem;">
            <div style="font-size:0.84rem;font-weight:700;color:#f87171;margin-bottom:0.45rem;">
              🏥 Выбивается с буйных пациентов (боссов) в виде сертификата:
            </div>
            <div style="display:flex;flex-direction:column;gap:0.35rem;">
              ${bosses.map(b => `
                <div style="display:flex;justify-content:space-between;align-items:center;background:#090d16;border:1px solid #252f42;border-radius:3px;padding:0.4rem 0.6rem;font-size:0.78rem;">
                  <button style="background:none;border:none;color:#fff;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-align:left;" onclick="closeModal(); openBossDetails(${b.bossId});" title="Открыть досье босса">
                    #${b.bossId} ${b.bossTitle} &rarr;
                  </button>
                  <span style="color:var(--accent-gold);font-weight:700;font-family:var(--font-mono);">${b.probability}%</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      let bodyHtml = `
        ${backBtnHtml}
        <div style="display:flex;gap:1rem;align-items:center;margin-bottom:0.8rem;">
          <img src="${t.image || ''}" width="80" height="80" style="background:#000;border:1px solid #4a5870;border-radius:4px;object-fit:contain;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,0.7);" alt="${t.title}"/>
          <div>
            <div style="font-size:1.15rem;font-weight:700;color:#fff;font-family:var(--font-header);">${t.title}</div>
            <div style="font-size:0.85rem;color:var(--accent-blue);font-weight:700;margin-top:3px;">Татуировка • ${t.slotTitle || 'Тело'}</div>
            <div style="font-size:0.74rem;color:var(--text-muted);margin-top:2px;">Идентификатор в базе: #${t.id}</div>
          </div>
        </div>

        <table class="modal-table">
          <tr><th>Зона нанесения (слот)</th><td><strong>${t.slotTitle || 'Тело'}</strong></td></tr>
          <tr><th>Требуемый уровень</th><td>${t.minLevel > 0 ? t.minLevel + ' ур.' : 'С 5 ур.'}</td></tr>
          <tr><th>Условия нанесения</th><td>${t.needsFormatted || 'Без дополнительных условий'}</td></tr>
          <tr><th>Цена в тату-салоне</th><td style="color:var(--accent-gold);font-weight:600;">${priceStr}</td></tr>
        </table>

        ${sourcesHtml}
      `;

      UI.modalBody.innerHTML = bodyHtml;
      UI.modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openEventItemDetails(itemId, fromBossId = null) {
      const data = window.GAME_DATA;
      const item = (data.inventory || []).find(i => i.id === itemId);
      if (!item) return;

      UI.modalTitle.textContent = `${item.title} (#${item.id})`;

      const sp = item.sellPrice || {};
      const priceText = sp.currency1 ? `${sp.currency1.toLocaleString()} монет` : 'Не продается';

      // Find boss sources (deduplicated & combined per boss)
      const bossSourcesMap = {};
      (data.bosses || []).forEach(b => {
        const isQuest = !!(b.artifactTitle && b.artifactTitle.trim().toLowerCase() === item.title.trim().toLowerCase());
        const drop = (b.drops || []).find(d => d.type === 'inventory' && d.id === item.id);

        if (isQuest || drop) {
          const loc = (data.locations || []).find(l => l.id === b.locationId);
          const locTitle = loc ? `Корпус ${loc.title}` : `#${b.locationId}`;
          const dropProb = drop ? (drop.probability || 100) : null;

          bossSourcesMap[b.id] = {
            bossId: b.id,
            bossTitle: b.title,
            locTitle: locTitle,
            isQuest: isQuest,
            dropProb: dropProb
          };
        }
      });
      const bossSources = Object.values(bossSourcesMap);

      // Find businesses where this item is used
      const bizUses = [];
      (data.businesses || []).forEach(bz => {
        let totalCount = 0;
        (bz.upgrades || []).forEach(up => {
          (up.price.items || []).forEach(it => {
            if (it.id === item.id) {
              totalCount += it.count;
            }
          });
        });
        if (totalCount > 0) {
          const loc = (data.locations || []).find(l => l.id === bz.locationId);
          const locTitle = loc ? `Корпус ${loc.title}` : '';
          bizUses.push({
            bizId: bz.id,
            bizTitle: bz.title,
            locId: bz.locationId,
            locTitle: locTitle,
            totalCount: totalCount
          });
        }
      });

      let sourcesHtml = '';
      if (bossSources.length > 0) {
        sourcesHtml = `
          <div style="margin-top:0.85rem;background:rgba(255,255,255,0.03);border:1px solid #1e293b;border-radius:4px;padding:0.75rem;">
            <div style="font-size:0.84rem;font-weight:700;color:#f87171;margin-bottom:0.45rem;">
              🏥 Где добыть (Падает с пациентов/боссов):
            </div>
            <div style="display:flex;flex-direction:column;gap:0.35rem;">
              ${bossSources.map(bs => {
                let badge = '';
                let probText = '';

                if (bs.isQuest && bs.dropProb && bs.dropProb !== 100) {
                  badge = '<span style="color:#a855f7;font-size:0.7rem;margin-left:0.35rem;font-weight:600;">[Квестовый итем]</span>';
                  probText = `<span style="color:#10b981;font-weight:700;">100%</span> <span style="color:var(--text-muted);font-size:0.72rem;font-weight:400;">(квест)</span> • <span style="color:var(--accent-gold);font-weight:700;">${bs.dropProb}%</span> <span style="color:var(--text-muted);font-size:0.72rem;font-weight:400;">(дроп)</span>`;
                } else if (bs.isQuest) {
                  badge = '<span style="color:#a855f7;font-size:0.7rem;margin-left:0.35rem;font-weight:600;">[Квестовый итем]</span>';
                  probText = '<span style="color:#10b981;font-weight:700;">100%</span>';
                } else {
                  probText = `<span style="color:var(--accent-gold);font-weight:700;">${bs.dropProb}%</span>`;
                }

                return `
                  <div style="display:flex;justify-content:space-between;align-items:center;background:#090d16;border:1px solid #252f42;border-radius:3px;padding:0.4rem 0.6rem;font-size:0.78rem;">
                    <div>
                      <button style="background:none;border:none;color:#fff;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-align:left;" onclick="closeModal(); openBossDetails(${bs.bossId});" title="Открыть досье босса">
                        ${bs.isQuest ? '📦' : '💀'} #${bs.bossId} ${bs.bossTitle} &rarr;
                      </button>
                      <span style="color:var(--accent-blue);font-size:0.73rem;margin-left:0.4rem;">(${bs.locTitle})</span>
                      ${badge}
                    </div>
                    <div style="font-family:var(--font-mono);font-size:0.78rem;">${probText}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else {
        sourcesHtml = `
          <div style="margin-top:0.85rem;background:rgba(255,255,255,0.02);border:1px solid #1e293b;border-radius:4px;padding:0.6rem;font-size:0.78rem;color:var(--text-muted);">
            ℹ️ Особый предмет больничного архива.
          </div>
        `;
      }

      let usageHtml = '';
      if (bizUses.length > 0) {
        usageHtml = `
          <div style="margin-top:0.85rem;background:rgba(255,255,255,0.03);border:1px solid #1e293b;border-radius:4px;padding:0.75rem;">
            <div style="font-size:0.84rem;font-weight:700;color:var(--accent-gold);margin-bottom:0.45rem;">
              🏢 Требуется для объектов больницы:
            </div>
            <div style="display:flex;flex-direction:column;gap:0.35rem;">
              ${bizUses.map(bu => `
                <div style="display:flex;justify-content:space-between;align-items:center;background:#090d16;border:1px solid #252f42;border-radius:3px;padding:0.4rem 0.6rem;font-size:0.78rem;">
                  <div>
                    <button style="background:none;border:none;color:#fff;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-align:left;" onclick="closeModal(); openFloorDetails(${bu.locId});" title="Перейти к объекту в корпус">
                      🏥 ${bu.bizTitle} &rarr;
                    </button>
                    ${bu.locTitle ? `<span style="color:var(--accent-blue);font-size:0.73rem;margin-left:0.4rem;">(${bu.locTitle})</span>` : ''}
                  </div>
                  <span style="color:#ffd166;font-weight:700;font-family:var(--font-mono);">x${bu.totalCount} шт.</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      const boss = fromBossId ? data.bosses.find(x => x.id === fromBossId) : null;
      const backBtnHtml = boss ? `
        <div style="margin-bottom:0.75rem;">
          <button class="weapon-filter-btn" style="padding:0.32rem 0.75rem;font-size:0.76rem;" onclick="openBossDetails(${boss.id})">
            &larr; Назад к боссу #${boss.id} (${boss.title})
          </button>
        </div>
      ` : '';

      let bodyHtml = `
        ${backBtnHtml}
        <div style="display:flex;gap:1rem;align-items:center;margin-bottom:0.85rem;background:#090d16;border:1px solid #1e293b;border-radius:4px;padding:0.75rem;">
          <div style="width:68px;height:68px;background:#06080e;border:1px solid #334155;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <img src="${item.image || ''}" alt="${item.title}" style="max-width:54px;max-height:54px;object-fit:contain;" onerror="this.src='images/ui/unknown.png'"/>
          </div>
          <div>
            <div style="font-size:1.15rem;font-weight:700;color:#fff;font-family:var(--font-header);">${item.title}</div>
            <div style="font-size:0.82rem;color:var(--accent-gold);margin-top:2px;">💰 Цена продажи: <strong>${priceText}</strong></div>
            <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px;">Идентификатор в базе: #${item.id}</div>
          </div>
        </div>

        <table class="modal-table">
          <tr><th>Тип предмета</th><td><span style="color:#38bdf8;font-weight:600;">Материал для улучшения объектов / Ивент</span></td></tr>
          <tr><th>Стоимость продажи</th><td style="color:var(--accent-gold);font-weight:600;">${priceText}</td></tr>
        </table>

        ${sourcesHtml}
        ${usageHtml}
      `;

      UI.modalBody.innerHTML = bodyHtml;
      UI.modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      UI.modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function openMarketSidebar() {
      state.marketSidebarOpen = true;
      const sb = document.querySelector('.market-sidebar');
      const bd = document.querySelector('.market-sidebar-backdrop');
      if (sb) sb.classList.add('open');
      if (bd) bd.classList.add('open');
      if (window.innerWidth <= 900) document.body.style.overflow = 'hidden';
    }

    function closeMarketSidebar() {
      state.marketSidebarOpen = false;
      const sb = document.querySelector('.market-sidebar');
      const bd = document.querySelector('.market-sidebar-backdrop');
      if (sb) sb.classList.remove('open');
      if (bd) bd.classList.remove('open');
      document.body.style.overflow = '';
    }

    function resetMarketFilters() {
      state.marketClothCategory = 'all';
      state.marketTattooSlot = 'all';
      state.marketCurrency = 'all';
      renderContent();
    }

    window.onload = init;
  </script>
</body>
</html>
